# Local stand-in for Firebase Hosting (Lab 9): static files, plus /api/** forwarded to the
# "Cloud Run" container on port 8080 -- the same rewrite firebase.json does in the cloud,
# so the browser sees one origin and needs no CORS.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
